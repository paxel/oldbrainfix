# cargo-about for the crates compiled into the desktop app (desktop/)
# and into the phone's liboldbrainfix_ocr.so (android/ocr, with the
# Android targets given on the command line); tool/licenses.sh writes
# licenses/desktop-crates.txt and licenses/android-crates.txt with it.
# MIT is preferred where a crate offers a choice, as its text carries the
# crate's copyright line; Apache-2.0 is taken over GPL-2.0-only
# (self_cell) and MIT or Apache-2.0 over LGPL-2.1-or-later (r-efi).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "BSL-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "0BSD",
    "BSD-1-Clause",
]
# Linux, Windows and macOS, as the desktop app builds for all three.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
workarounds = ["chrono", "ring", "rustls", "rustix", "linux-raw-sys", "unicode-ident", "cocoa"]

# Crates whose package lacks its licence file: the file from the crate's
# own repository at the commit it was published from, checked by its
# SHA-256. A crate added without one makes tool/licenses.sh fail; add it
# here the same way. The few crates whose repository has no such file
# either keep the standard text (see tool/licenses.sh).

# dpi's MIT file is libm's, which cargo-about does not recognise alone.
[dpi.clarify]
license = "Apache-2.0 AND MIT"
[[dpi.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "6dc0e068dcf3a5bc8e054205b85b7720e1d49265bbc64bf515d2cf79197df69a"
[[dpi.clarify.files]]
path = "LICENSE-LIBM-MIT"
license = "MIT"
checksum = "9eff396a99bafd208e7126602420d6864f6066c08b84485a5b032320a9c01997"

