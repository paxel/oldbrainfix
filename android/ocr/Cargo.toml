[package]
name = "oldbrainfix_ocr"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Text in photos for Old Brain Fix on Android: RustO behind JNI (ADR 0007)."
publish = false

[lib]
# liboldbrainfix_ocr.so, loaded by OcrNative in the app.
crate-type = ["cdylib"]

[dependencies]
# RustO without its UniFFI bindings. It builds rten with the ONNX parser
# too; the bundled models are .rten. rten, rten-tensor and ndarray at
# RustO's own versions load the models from bytes.
rusto-rs = { version = "0.3.2", default-features = false }
rten = { version = "0.27.0", default-features = false, features = ["rten_format"] }
rten-tensor = "0.27.0"
ndarray = { version = "0.16.1", default-features = false }
jni = "0.21.1"

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[profile.release]
lto = "thin"
codegen-units = 4
panic = "unwind"
strip = true

# RustO is far too slow unoptimised, also in `cargo test`.
[profile.dev.package."*"]
opt-level = 3
