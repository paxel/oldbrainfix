[package]
name = "oldbrainfix-whisper"
description = "Transcripts for the Old Brain Fix desktop: the phone's vendored whisper.cpp behind a small C bridge, the speech model it needs, and recordings decoded as Whisper hears them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not published, which also keeps it out of the third-party licences.
publish = false
build = "build.rs"

[lib]
name = "oldbrainfix_whisper"

[dependencies]
sha2 = "0.10"
hex = "0.4"
# The phone's AAC .m4a recordings and the desktop's WAV ones, and sound
# files made into voice Notes: MP3, and Ogg with Vorbis or Opus.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "pcm", "wav", "mp3", "ogg", "vorbis"] }
# Opus, as messengers send voice messages, which symphonia cannot
# decode; pure Rust.
opus-decoder = "0.1.1"
# The speech model from Old Brain Fix's own release, over HTTPS only.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[build-dependencies]
cmake = "0.1.58"

[dev-dependencies]
tempfile = "3.10"
