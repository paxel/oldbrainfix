[package]
name = "oldbrainfix-gui"
description = "The Old Brain Fix desktop app: an egui shell over oldbrainfix-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "oldbrainfix_gui"

[[bin]]
name = "oldbrainfix"
path = "src/bin/oldbrainfix.rs"

[dependencies]
oldbrainfix-core = { path = "../oldbrainfix-core", version = "0.1.0" }
oldbrainfix-l10n = { path = "../oldbrainfix-l10n", version = "0.1.0" }
eframe = "0.35"
egui = "0.35"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
directories = "6"
sys-locale = "0.3"

[build-dependencies]
oldbrainfix-l10n = { path = "../oldbrainfix-l10n", version = "0.1.0" }

[dev-dependencies]
egui_kittest = "0.35"
serde_json = "1.0"
tempfile = "3.10"
