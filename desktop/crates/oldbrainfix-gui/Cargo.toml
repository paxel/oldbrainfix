[package]
name = "oldbrainfix-gui"
description = "The Old Brain Fix desktop app: an egui shell over oldbrainfix-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not published, which also keeps it out of the third-party licences.
publish = false
build = "build.rs"

[lib]
name = "oldbrainfix_gui"

[[bin]]
name = "oldbrainfix"
path = "src/bin/oldbrainfix.rs"

[dependencies]
oldbrainfix-core = { path = "../oldbrainfix-core", version = "0.3.0" }
oldbrainfix-l10n = { path = "../oldbrainfix-l10n", version = "0.3.0" }
oldbrainfix-whisper = { path = "../oldbrainfix-whisper", version = "0.3.0" }
eframe = "0.35"
egui = "0.35"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
directories = "6"
sys-locale = "0.3"
# Desktop notifications, as Catlog's desktop shows them.
notify-rust = "4"
# The capture hotkey on X11, Windows and macOS.
global-hotkey = "0.9"
parking_lot = "0.12"
# Voice Notes: the microphone and the speakers, as Catlog plays its
# sounds; WAV as the desktop records, AAC in .m4a as the phone does,
# and MP3 and Ogg Vorbis from sound files (Ogg Opus plays through
# oldbrainfix-whisper's decoder).
rodio = { version = "0.22", default-features = false, features = ["playback", "recording", "wav", "mp4", "mp3", "vorbis"] }
# Pictures pasted in.
arboard = "3.6"
# Photos pasted or dropped in, kept as the phone keeps them, and shown.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Photo Texts with the phone's engine and models (ADR 0007), as
# android/ocr builds them: RustO without its UniFFI bindings, and rten,
# rten-tensor and ndarray at RustO's own versions to load the models
# from bytes.
rusto-rs = { version = "0.3.2", default-features = false }
rten = { version = "0.27.0", default-features = false, features = ["rten_format"] }
rten-tensor = "0.27.0"
ndarray = { version = "0.16.1", default-features = false }
# The pair code as a QR in the Sync view.
qrcode = { version = "0.14", default-features = false }
# The shared folder, the Backup folder and every file picked with the
# system's own dialog, as Catlog's desktop picks them: the file chooser
# portal on Linux, which inside the Flatpak hands back a document portal
# path that stays valid across restarts.
rfd = "0.17"

# The tray as a StatusNotifierItem over D-Bus, without GTK.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# The capture hotkey on Wayland, through the GlobalShortcuts portal, and
# the login start inside the Flatpak, through the Background portal.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "background", "global_shortcuts"] }
async-io = "2"
futures-lite = "2"

# The tray in the notification area on Windows and in the menu bar on
# macOS, without GTK.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

# The login's full name for the own Profile (`getpwuid_r`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The login's display name for the own Profile (`GetUserNameExW`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Authentication_Identity"] }

# Closing a notification once its Occurrence is Done.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
oldbrainfix-l10n = { path = "../oldbrainfix-l10n", version = "0.3.0" }

[dev-dependencies]
# wgpu draws the desktop screenshots (tests/screenshots.rs).
egui_kittest = { version = "0.35", features = ["wgpu"] }
# A phone joining the Sync view in the tests.
ureq = { version = "3", default-features = false, features = ["rustls"] }
chrono-tz = "0.10"
serde_json = "1.0"
# Profile cards forged by hand in the tests, as the core writes them.
base64 = "0.22"
tempfile = "3.10"
