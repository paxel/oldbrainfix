[package]
name = "oldbrainfix-gui"
description = "The Old Brain Fix desktop app: an egui shell over oldbrainfix-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "oldbrainfix_gui"

[[bin]]
name = "oldbrainfix"
path = "src/bin/oldbrainfix.rs"

[dependencies]
oldbrainfix-core = { path = "../oldbrainfix-core", version = "0.1.0" }
oldbrainfix-l10n = { path = "../oldbrainfix-l10n", version = "0.1.0" }
eframe = "0.35"
egui = "0.35"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
directories = "6"
sys-locale = "0.3"
# Desktop notifications, as Catlog's desktop shows them.
notify-rust = "4"
# The capture hotkey on X11, Windows and macOS.
global-hotkey = "0.9"

# The tray as a StatusNotifierItem over D-Bus, without GTK.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# The capture hotkey on Wayland, through the GlobalShortcuts portal.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-io = "2"
futures-lite = "2"

# Closing a notification once its Occurrence is Done.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
oldbrainfix-l10n = { path = "../oldbrainfix-l10n", version = "0.1.0" }

[dev-dependencies]
egui_kittest = "0.35"
chrono-tz = "0.10"
serde_json = "1.0"
tempfile = "3.10"
