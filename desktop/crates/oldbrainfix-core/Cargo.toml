[package]
name = "oldbrainfix-core"
description = "Core of the Old Brain Fix desktop app: the signed entry log and the Notes, Areas, Topics and Routines read from it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not published, which also keeps it out of the third-party licences.
publish = false

[lib]
name = "oldbrainfix_core"

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
ed25519-dalek = "2"
base64 = "0.22"
# Shares one store between the window and the alerts, one writer at a time.
parking_lot = "0.12"
# LAN sync: the desktop hosts over TLS with its own self-signed
# certificate, as Catlog's desk does.
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Paired Devices find the desktop's host on the network (mDNS/DNS-SD);
# no async runtime, no logging.
mdns-sd = { version = "0.21", default-features = false }
# End-to-end encryption per Area (ADR 0003, 0012), as the Dart core's
# `cryptography` seals: XChaCha20-Poly1305, nonces from getrandom above.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Blob names in the shared folder.
hmac = "0.12"
# The bundle file (ADR 0003): a zip of stored files only, as the Dart
# core's `archive` writes it; no compression, no encryption of its own.
zip = { version = "=8.6.0", default-features = false }

[dev-dependencies]
# A real zone for the fixtures' daylight-saving cases.
chrono-tz = "0.10"
# Reads the fixtures' doubles back bit for bit.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3.10"
# Joins the host in the tests as the phone does.
ureq = { version = "3", default-features = false, features = ["rustls"] }
