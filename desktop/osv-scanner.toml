# OSV-Scanner's exceptions for desktop/Cargo.lock. CI, the release gate
# and the weekly Security run (.github/workflows/) all read them. Each one
# says why the desktop app is not exposed and why no update removes the
# crate. CI and the release list a notice that a crate is unmaintained
# without failing (tool/osv_gate.py); the weekly run fails on it. When an
# entry's date passes, the weekly run fails again: that is the review.
# Check the advisory and the parent crates again, then remove the entry or
# move the date with a reason.

[[IgnoredVulns]]
id = "RUSTSEC-2026-0192"
ignoreUntil = 2027-04-27
reason = """ttf-parser is unmaintained; no vulnerability is described. \
It comes only through winit 0.30 -> sctk-adwaita 0.10 -> ab_glyph, which draws \
the window title bar on Wayland desktops without server-side decorations. The \
font it parses is the system title-bar font (gsettings and fc-match) or \
sctk-adwaita's embedded Cantarell, never a file from a bundle, a Backup or \
another person. The app's own text is drawn by egui without ttf-parser. \
winit 0.30.13, the latest, requires sctk-adwaita ^0.10.1, and ab_glyph 0.2.32, \
the latest, still uses ttf-parser."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
ignoreUntil = 2027-04-27
reason = """zbus_names is unmaintained because it moved into zbus 6; no \
vulnerability is described. It is part of zbus 5, which talks to the user's own \
session bus (accessibility through accesskit_unix and atspi, the tray, \
notifications, the portals). zbus 5 is used directly by oldbrainfix-gui and by \
accesskit_unix 0.24.1, atspi 0.30.0, ashpd 0.13.13, ksni 0.3.7 and \
notify-rust 4.18.2, all their latest releases, so no update drops it yet."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
ignoreUntil = 2027-04-27
reason = """zvariant is unmaintained because it moved into zbus 6; no \
vulnerability is described. Same as RUSTSEC-2026-0371: part of zbus 5, which \
oldbrainfix-gui and the latest accesskit_unix, atspi, ashpd, ksni and \
notify-rust still use."""

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
ignoreUntil = 2027-04-27
reason = """zvariant_derive is unmaintained because it moved into zbus 6; no \
vulnerability is described. A proc macro of zbus 5, run at compile time only. \
Same as RUSTSEC-2026-0371."""

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-05-03
reason = """paste is unmaintained; no vulnerability is described. A proc \
macro, run at compile time only. It comes only through rusto-rs 0.3.2 -> \
nalgebra 0.33 -> simba 0.9 (Photo Texts). rusto-rs 0.3.2, the latest, requires \
nalgebra ^0.33, which requires simba ^0.9, and simba 0.9.1 requires paste; only \
simba 0.10 drops it."""
