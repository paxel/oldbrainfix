[workspace]
resolver = "2"
members = ["crates/oldbrainfix-core", "crates/oldbrainfix-l10n", "crates/oldbrainfix-gui"]

# The version equals the pubspec's (a test in oldbrainfix-core checks it).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paxel/oldbrainfix"

[profile.release]
strip = true
lto = "thin"
