[workspace]
resolver = "2"
members = [
    "crates/oldbrainfix-core",
    "crates/oldbrainfix-l10n",
    "crates/oldbrainfix-whisper",
    "crates/oldbrainfix-gui",
]

# The version equals the pubspec's (a test in oldbrainfix-core checks it).
[workspace.package]
version = "0.5.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/paxel/oldbrainfix"

# No unsafe and no panics (#229, Q555 (a), Q560 (a)). `unsafe_code` is
# `deny`, not `forbid`: a `forbid` cannot be lifted by the module-level
# `allow` the two FFI modules (oldbrainfix-whisper's lib.rs and
# oldbrainfix-gui's login.rs) need. Tests may unwrap, expect, panic and
# index (clippy.toml; the files in tests/ allow them at the top).
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

# RustO is far too slow unoptimised, also in `cargo test`.
[profile.dev.package.rusto-rs]
opt-level = 3
[profile.dev.package.clipper2-rust]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
# Argon2id at the Backups' 64 MiB is far too slow unoptimised too.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
