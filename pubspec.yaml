name: oldbrainfix
description: "Old Brain Fix — capture a thought in one tap, get nagged until it is sorted or done."
publish_to: 'none'

# App version. Keep in sync with CHANGELOG.md.
version: 0.3.0+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  oldbrainfix_core:
    path: packages/oldbrainfix_core
  intl: any
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  # The Profile card's QR (#107) at error correction L, which the core's
  # Recovery Sheet QR does not use; already the core's. BSD-3-Clause.
  qr: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # What ships inside the app but not as a Dart package, with its
  # licence, for the open-source licences (see licenses/).
  assets:
    - licenses/common.txt
    - licenses/android.txt
    - licenses/android-crates.txt
    # The band-aid brain of the feature graphic
    # (play-developer/feature-graphic.svg), rendered 28 dp high at 1x to
    # 4x; the project's own art, under the project's licence.
    - assets/brain.png
