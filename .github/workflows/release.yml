# The Android release pipeline, copied from cat(a)log's and adapted. A
# `v*` tag (or the manual dispatch button) runs it:
#
#   gate           — every gate CI has, and more (#231): tag = pubspec
#                    version = desktop Cargo version, a CHANGELOG
#                    section for the version, no open high or
#                    critical CodeQL alert, no known vulnerability in a
#                    lockfile or the whisper.cpp submodule (OSV-Scanner),
#                    that submodule at the tag third_party/README.md and
#                    licenses/common.txt name, whether it is upstream's
#                    latest release (report-only), What's new present, Dart
#                    format, analyze fatal-infos (app and core), no `!`
#                    null assertion outside tests, all Dart and Flutter
#                    tests, no untranslated string, the generated
#                    localizations current, the guide's phone
#                    frames, the cross-core fixtures current, the site
#                    tests, the Python tools' tests, the Flatpak's
#                    cargo sources current and its files linted, the
#                    Dart core's and the app's coverage floors
#   gate-desktop   — the Rust half: licence lists current, the OCR
#                    library's and the desktop's format, clippy with the
#                    workspace lints and all tests, the guide's desktop
#                    frames, the Rust core's and GUI's coverage floors
#   geiger         — cargo geiger, report-only: unsafe counts in the log,
#                    never blocks
#   build-android  — signed per-ABI + universal APKs and the Play bundle,
#                    the Kotlin unit tests and every Android library in
#                    the licences (gates too: they fail the job before
#                    anything is uploaded, and the Release needs this job),
#                    refused when signed with the debug key; the bundle
#                    goes to Google Play's internal track with What's new
#                    from docs/release-notes-<version>.md
#   build-linux    — Rust desktop: tar.gz, .deb and AppImage per arch
#   build-flatpak  — the Flatpak per arch, built from source; the built
#                    repository past flatpak-builder-lint (x86_64), a gate
#                    before the bundle is uploaded
#   screenshots    — desktop screenshots, drawn by kittest from demo data,
#                    attached to the Release (the metainfo points at them)
#   build-windows  — Rust desktop: zip with oldbrainfix.exe
#   build-macos    — Rust desktop: ad-hoc signed app in a .dmg, per arch
#   render-channels — Homebrew cask + formula and Scoop manifest rendered from
#                    the artifacts, uploaded as an artifact on every run
#   fdroid         — the arm64 APK, the store listing and the same What's
#                    new into paxel/fdroid
#   release        — GitHub Release, notes = the CHANGELOG section for the tag
#   channels       — the rendered files pushed to the tap and the bucket, after
#                    the Release, when publishing
#
# The Whisper model is not part of any of this: the app downloads it from
# the separate `whisper-model-v1` release, which no tag here touches.
#
# Publishing (Play, F-Droid, the Release, the tap and the bucket) happens on a tag, or on a manual
# dispatch that says publish=true. A dispatch without it is the dry run:
# every artifact is built and uploaded, nothing leaves GitHub.
#
# One-time setup (repository secrets):
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD — upload keystore,
#                 key alias `oldbrainfix`
#   PLAY_SERVICE_ACCOUNT_JSON — Play Console service account
#   CHANNEL_PAT — PAT with push access to paxel/homebrew-tap and
#                 paxel/scoop-bucket
#   CHANNEL_PAT_FDROID — PAT with push access to paxel/fdroid
#   FDROID_KEYSTORE_BASE64 / FDROID_KEYSTORE_PASS — the F-Droid repo key,
#                 the same one cat(a)log and Chaos Alert use
#
# No Flathub: its generative AI policy forbids AI-written manifests and
# AI-opened pull requests, and this project is written by agents.
name: Release

on:
  push:
    tags: ["v*"]
  # Releasing from the Actions UI: Run workflow → type the tag. `gh release
  # create` makes the tag at HEAD when it doesn't exist yet, so the button
  # alone can cut a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      publish:
        description: "Publish (release, Play, F-Droid, tap, bucket); off = dry run"
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Every publishing step asks this; the artifacts are built regardless.
  PUBLISH: ${{ github.ref_type == 'tag' || github.event.inputs.publish == 'true' }}

jobs:
  gate:
    name: Gate (tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      # The full history, so the code-scanning step finds the branches
      # that hold the tagged commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          fetch-depth: 0
      # The same scan as CI's (#231): a known vulnerability in any lockfile
      # or at the commit of the submodule third_party/whisper.cpp (#247)
      # stops the release; an unmaintained notice is listed only.
      - name: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --format=json
            --output-file=osv-results.json
            --include-git-root
            --x-exclude=third_party
            --recursive
            ./
      - name: No known vulnerability (unmaintained notices reported only)
        run: python3 tool/osv_gate.py osv-results.json
      # The submodule at the tag third_party/README.md names, and
      # licenses/common.txt naming the same release, or the release stops
      # (#247). An update needs the Transcripts checked, so a newer
      # whisper.cpp release upstream is only a warning.
      - name: whisper.cpp is at its named tag (upstream's latest release report-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/whisper_pin.py
      - name: Tag, pubspec version and desktop Cargo version agree
        run: |
          ver=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          cargo_ver=$(grep -m1 '^version = ' desktop/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag=${RELEASE_TAG#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != pubspec version $ver" >&2; exit 1; }
          [ "$cargo_ver" = "$tag" ] || { echo "tag v$tag != desktop Cargo version $cargo_ver" >&2; exit 1; }
      # The Release's notes are this section (the release job below), which
      # would otherwise fall back to a bare "Release <version>." line.
      - name: CHANGELOG.md has a section for this version
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab && NF { print }
          ' CHANGELOG.md | grep -q . || { echo "no ## [$ver] section with entries in CHANGELOG.md" >&2; exit 1; }
      # CodeQL (#233) analyses branches, not tags: every open alert on a
      # branch that holds this commit is listed, and one of severity high
      # or critical (security severity, or rule severity error) stops the
      # release. A branch CodeQL never analysed is skipped; none analysed
      # at all stops it too.
      - name: No open high or critical code-scanning alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          branches=$(git branch -r --contains "$sha" --format='%(refname:lstrip=3)' | grep -vx HEAD || true)
          analysed=0
          blocking=0
          for b in $branches; do
            if ! gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?ref=refs/heads/$b&state=open&per_page=100" \
              --jq '.[] | [(.rule.security_severity_level // "-"), .rule.severity, .rule.id, .most_recent_instance.location.path, .html_url] | @tsv' \
              > "$RUNNER_TEMP/alerts.tsv" 2> "$RUNNER_TEMP/error.txt"; then
              if grep -q 'no analysis found' "$RUNNER_TEMP/error.txt"; then
                echo "$b: not analysed by CodeQL, skipped"
                continue
              fi
              cat "$RUNNER_TEMP/error.txt" >&2
              exit 1
            fi
            analysed=$((analysed + 1))
            echo "Open code-scanning alerts on $b (security severity, severity, rule, file, link):"
            cat "$RUNNER_TEMP/alerts.tsv"
            n=$(awk -F'\t' '$1 == "high" || $1 == "critical" || $2 == "error"' "$RUNNER_TEMP/alerts.tsv" | wc -l)
            echo "$n of them high or critical"
            blocking=$((blocking + n))
          done
          [ "$analysed" -gt 0 ] || { echo "no CodeQL analysis on any branch that holds $sha" >&2; exit 1; }
          [ "$blocking" -eq 0 ] || { echo "$blocking open high or critical code-scanning alerts" >&2; exit 1; }
      # Play and F-Droid take What's new from the store kit's record; a
      # tag without it would ship with none.
      - name: What's new for Play and F-Droid exists
        run: |
          for lang in en de; do
            python3 tool/whats_new.py "docs/release-notes-${RELEASE_TAG#v}.md" "$lang" > /dev/null
          done
      # The same notes are the apps' own What's new Note (#180): both
      # bundle assets/help/whats_new.json, so it must hold this version.
      - name: The apps bundle this version's What's new
        run: |
          python3 tool/whats_new.py --bundle --require "${RELEASE_TAG#v}"
          git diff --exit-code -- assets/help/whats_new.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Core — analyze and test
        working-directory: packages/oldbrainfix_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          # No `!` null assertion outside tests, in the core or the app (#230).
          dart run tool/no_null_assertions.dart lib ../../lib
          dart test
      - name: App — analyze and test
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      # The app, the core and the tools, after both pub gets: the
      # package config sets the language version, and with it the style.
      - name: Dart format
        run: dart format --output=none --set-exit-if-changed .
      - name: No untranslated strings
        run: test "$(tr -d '[:space:]' < build/untranslated.json)" = "{}"
      # The generated lib/l10n/app_localizations*.dart are committed; the
      # runner regenerates them, so a stale copy would pass unseen.
      - name: The generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
          test -z "$(git status --porcelain -- lib/l10n)"
      - name: The guide's phone frames match their screens
        run: flutter test test/screenshots/screenshots_test.dart --run-skipped --concurrency=1 --plain-name 'guide frames'
      - name: The fixture corpus the desktop core is tested against is current
        working-directory: packages/oldbrainfix_core
        run: |
          dart run tool/gen_fixtures.dart ../../desktop/fixtures
          git diff --exit-code -- ../../desktop/fixtures
          test -z "$(git status --porcelain -- ../../desktop/fixtures)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Site — unit tests
        run: node --test "tool/site/*.test.js"
      - name: Metainfo, What's-new, alarm sound, OSV gate, coverage floor and whisper pin tools — unit tests
        working-directory: tool
        run: python3 -m unittest test_whats_new test_metainfo test_alarm_sound test_osv_gate test_coverage_floor test_whisper_pin
      # The Flatpak's files, as CI checks them: cargo-sources.json current,
      # and the metainfo, desktop file and manifest past Flathub's linters
      # (without the network: the screenshots exist once the Release does).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: cargo-sources.json is current with desktop/Cargo.lock
        run: |
          desktop/packaging/flatpak/cargo-sources.sh
          git diff --exit-code -- desktop/packaging/flatpak/cargo-sources.json
      - name: appstreamcli, desktop-file-validate and flatpak-builder-lint
        env:
          LINT_IMAGE: ghcr.io/flathub-infra/flatpak-builder-lint@sha256:6057d350c1f67cfd72b87891ea779a9de2567ff70e33b480d20eebcffef08fa0
        run: |
          ver=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          desktop/packaging/flatpak/render.sh flathub "$ver" "$(git log -1 --format=%cs)" "v$ver" "$GITHUB_SHA"
          cp desktop/packaging/linux/io.github.paxel.oldbrainfix.desktop flathub/
          docker run --rm -v "$PWD/flathub:/work" -w /work --entrypoint sh "$LINT_IMAGE" -c '
            set -e
            appstreamcli validate --no-net --explain io.github.paxel.oldbrainfix.metainfo.xml
            desktop-file-validate io.github.paxel.oldbrainfix.desktop
            flatpak-builder-lint manifest io.github.paxel.oldbrainfix.yml'
      # Coverage floors (#232): the Dart core and the Flutter app below
      # their floor in tool/coverage-floors.txt stop the release. A floor
      # that rose is raised there on the runner only; raise it with a
      # local run of tool/coverage.sh and commit it.
      - name: Coverage floors — Dart core and Flutter app
        run: tool/coverage.sh dart-core flutter-app

  gate-desktop:
    name: Gate (desktop and OCR, Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # As in CI: forty test binaries with full debug info fill the
    # runner's disk; line tables keep backtraces readable.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Room on the runner's disk (its preinstalled SDKs are not used here)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: System libraries (ALSA for the microphone, cmake for whisper.cpp, lavapipe for the guide's frames)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake g++ mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: The third-party licence lists are current
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          flutter pub get
          dart run tool/licenses.dart
          git diff --exit-code -- licenses
          test -z "$(git status --porcelain -- licenses)"
      # Its own lints (#229) with -D warnings, as for the desktop.
      - name: OCR library — format, lint and unit tests
        working-directory: android/ocr
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      # Clippy enforces the workspace lints (#229): no unsafe outside the
      # FFI modules, no unwrap, expect, panic or indexing outside tests.
      - name: Desktop — format, lint and test
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: The guide's desktop frames match their screens
        working-directory: desktop
        run: cargo test -p oldbrainfix-gui --test screenshots --locked -- --ignored guide_frames
      # Coverage floors (#232), the Rust half: the core and the GUI below
      # their floor in tool/coverage-floors.txt stop the release.
      - name: Coverage floors — Rust core and Rust GUI
        run: |
          cargo install cargo-llvm-cov --locked --version 0.9.1
          tool/coverage.sh rust-core rust-gui

  # Report-only (#231): the unsafe counts of the desktop and the OCR
  # library and their dependencies, for the log. cargo geiger is known to
  # abort on some workspaces (it did on another of this user's projects
  # locally), so the job and each run may fail without failing the release,
  # and nothing needs it. The real rule is clippy's `unsafe_code` lint above.
  geiger:
    name: Unsafe code report (cargo geiger, report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: System libraries (ALSA for the microphone, cmake for whisper.cpp)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake g++
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - run: cargo install cargo-geiger --locked --version 0.14.0
      # geiger wants a package, not the virtual workspace root; the GUI
      # crate pulls in the other three.
      - name: Desktop
        continue-on-error: true
        run: cargo geiger --manifest-path desktop/crates/oldbrainfix-gui/Cargo.toml
      - name: OCR library
        continue-on-error: true
        run: cargo geiger --manifest-path android/ocr/Cargo.toml

  build-android:
    name: Android APKs and bundle
    needs: [gate, gate-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      # The keystore must be readable by this Java: one made with Java 25's
      # keytool (PBMAC1) reads as "keystore password was incorrect" here.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # RustO for Photo Texts is Rust, cross-built by the APK build.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - run: cargo install cargo-ndk --locked --version 4.1.2
      # The password never passes through the shell or key.properties:
      # Gradle reads it from the environment as it is.
      - name: Write signing config from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nkeyAlias=oldbrainfix\n' "$RUNNER_TEMP/upload.jks" > android/key.properties
      - run: flutter pub get
      # Whisper and RustO are built for the two phone ABIs only, so no
      # x86_64 APK: it would ship without transcription and text reading.
      # $GITHUB_RUN_NUMBER of this workflow is the version code.
      - name: Build release APKs and the Play app bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-number=$GITHUB_RUN_NUMBER
          flutter build apk --release --target-platform android-arm,android-arm64 --build-number=$GITHUB_RUN_NUMBER
          flutter build appbundle --release --target-platform android-arm,android-arm64 --build-number=$GITHUB_RUN_NUMBER
      # After the builds, as in CI: they set up what the Gradle project
      # needs. Still before anything is published.
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
      # As in CI: a library of the release runtime classpath without its
      # entry in licenses/android.txt stops the release.
      - name: Every Android library is in the licences
        run: |
          (cd android && ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath) > build/runtime-classpath.txt
          dart run tool/licenses.dart --check-maven build/runtime-classpath.txt
      # Gradle already refuses a release build without key.properties;
      # this checks what actually came out. An APK signed with the debug
      # key would lock F-Droid clients to it for good.
      - name: Refuse anything signed with the debug key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*release.apk; do
            "$apksigner" verify --print-certs "$apk" > certs.txt
            if grep -q "CN=Android Debug" certs.txt; then
              echo "$apk is signed with the debug key" >&2
              exit 1
            fi
          done
          aab=build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$aab" > certs.txt
          grep -q "Owner:" certs.txt || { echo "$aab is not signed" >&2; exit 1; }
          if grep -q "CN=Android Debug" certs.txt; then
            echo "$aab is signed with the debug key" >&2
            exit 1
          fi
      - name: Rename artifacts
        run: |
          v="${RELEASE_TAG#v}"
          d=build/app/outputs/flutter-apk
          mkdir -p dist
          mv "$d/app-arm64-v8a-release.apk"   "dist/oldbrainfix-$v-android-arm64-v8a.apk"
          mv "$d/app-armeabi-v7a-release.apk" "dist/oldbrainfix-$v-android-armeabi-v7a.apk"
          mv "$d/app-release.apk"             "dist/oldbrainfix-$v-android-universal.apk"
          mv build/app/outputs/bundle/release/app-release.aab "dist/oldbrainfix-$v-android-playstore.aab"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android
          path: dist/*
      - name: What's new for Google Play
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p whatsnew
          notes="docs/release-notes-${RELEASE_TAG#v}.md"
          python3 tool/whats_new.py "$notes" en > whatsnew/whatsnew-en-US
          python3 tool/whats_new.py "$notes" de > whatsnew/whatsnew-de-DE
      # `status: completed` is the whole point: `draft` parks the release
      # in the Console and waits for a human to press Start rollout.
      - name: Publish to Google Play
        if: env.PUBLISH == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.paxel.oldbrainfix
          # Glob, not the tag: the file is named without the leading "v"
          # and a `with:` value cannot strip it.
          releaseFiles: dist/*-android-playstore.aab
          # Internal testing only. Promoting to closed testing is a
          # decision, taken in the Console after the build was tried.
          track: internal
          status: completed
          whatsNewDirectory: whatsnew

  build-linux:
    name: Linux desktop (${{ matrix.arch }})
    needs: [gate, gate-desktop]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake g++ curl file
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked --bin oldbrainfix
      - name: Pack tar.gz, .deb and AppImage
        run: |
          v="${RELEASE_TAG#v}"
          desktop/packaging/linux/pack.sh "$v" "${{ matrix.arch }}" desktop/target/release/oldbrainfix dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  # The same manifest, rendered the same way, as Flathub builds: from
  # source, the network off during the build.
  build-flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: [gate, gate-desktop]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      # Older releases in the metainfo are dated by their tags.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          fetch-depth: 0
      - name: flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
      - name: Build the bundle from source
        run: |
          # flatpak-builder sandboxes through bwrap, which Ubuntu's
          # AppArmor default refuses user namespaces to.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          v="${RELEASE_TAG#v}"
          RELEASE_DATE=$(git log -1 --format=%cs) \
            desktop/packaging/flatpak/pack.sh "$v" "${{ matrix.arch }}" dist flatpak-repo
      # As in CI, before the bundle is uploaded. Only the screenshots are
      # excepted: they become the Release's assets after this job.
      - name: flatpak-builder-lint on the built repository
        if: matrix.arch == 'x86_64'
        run: |
          docker run --rm -v "$PWD/flatpak-repo:/repo" \
            -v "$PWD/desktop/packaging/flatpak/ci-lint-exceptions.json:/exceptions.json:ro" \
            ghcr.io/flathub-infra/flatpak-builder-lint@sha256:6057d350c1f67cfd72b87891ea779a9de2567ff70e33b480d20eebcffef08fa0 \
            --exceptions --user-exceptions /exceptions.json repo /repo
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*

  # The metainfo points at these files on the Release.
  screenshots:
    name: Desktop screenshots
    needs: [gate, gate-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Build dependencies and a software Vulkan (lavapipe) to draw with
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake g++ mesa-vulkan-drivers libvulkan1
      - name: Render the screenshots from demo data
        working-directory: desktop
        env:
          SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
        run: cargo test -p oldbrainfix-gui --test screenshots --locked -- --ignored render_the_screenshots
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: screenshots
          path: screenshots/*.png

  build-windows:
    name: Windows desktop
    needs: [gate, gate-desktop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked --bin oldbrainfix
      - name: Pack
        shell: pwsh
        run: |
          $v = $env:RELEASE_TAG.TrimStart("v")
          desktop\packaging\windows\pack.ps1 -Version $v -Binary desktop\target\release\oldbrainfix.exe -Dist dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows
          path: dist/*

  build-macos:
    name: macOS desktop (${{ matrix.arch }})
    needs: [gate, gate-desktop]
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # Last Intel image GitHub offers; when it retires, switch the
          # x86_64 artifact to a cross-compile from the arm64 runner.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked --bin oldbrainfix
      - name: App bundle into dmg (ad-hoc signed)
        run: |
          v="${RELEASE_TAG#v}"
          desktop/packaging/macos/pack.sh "$v" "${{ matrix.arch }}" desktop/target/release/oldbrainfix dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  render-channels:
    name: Render cask, formula and manifest
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "{linux-*,windows,macos-*}"
          path: dist
          merge-multiple: true
      - name: Render from the templates with the artifacts' checksums
        run: desktop/packaging/render-channels.sh "${RELEASE_TAG#v}" dist out
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: channels
          path: out/*

  fdroid:
    name: F-Droid repo
    needs: build-android
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # The listing (texts, F-Droid fields) and the changelog.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          path: app
      # Channel-repo pattern: the index and APK live in paxel/fdroid (own
      # Pages), not in this repo's history.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: android
          path: apks
      - name: Install fdroidserver
        run: pip install --quiet fdroidserver
      - name: Publish to the shared channel repo
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT_FDROID }}
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          v="${RELEASE_TAG#v}"
          git config --global user.name "oldbrainfix-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/fdroid.git" channel
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fdroid.p12"
          cd channel
          mkdir -p repo
          # F-Droid gets the 64-bit APK only: Flutter numbers split APKs
          # ABI x 1000 + build, which F-Droid's archiving would sort wrongly.
          # The main repository keeps the newest version and F-Droid moves
          # the one before into the archive, which keeps three: make room.
          mkdir -p archive
          ls archive/oldbrainfix-*-android-arm64-v8a.apk 2>/dev/null | sort -V | head -n -2 | xargs -r rm -f
          cp "$GITHUB_WORKSPACE/apks/oldbrainfix-$v-android-arm64-v8a.apk" repo/
          # The store listing travels with the app: only this app's files
          # are replaced, the other apps' stay untouched. The icon and the
          # phone screenshots come along from fastlane's images folders.
          id=io.github.paxel.oldbrainfix
          app="$GITHUB_WORKSPACE/app"
          mkdir -p metadata
          cp "$app/fdroid/metadata.yml" "metadata/$id.yml"
          rm -rf "metadata/$id" "repo/$id"
          mkdir -p "metadata/$id"
          cp -r "$app/fastlane/metadata/android/." "metadata/$id/"
          # What's new: the same text as on Google Play.
          for pair in en:en-US de:de-DE; do
            mkdir -p "metadata/$id/${pair#*:}/changelogs"
            python3 "$app/tool/whats_new.py" "$app/docs/release-notes-$v.md" "${pair%%:*}" \
              > "metadata/$id/${pair#*:}/changelogs/default.txt"
          done
          # Must stay word for word the same as cat(a)log's and Chaos
          # Alert's release workflows, or each release renames the repository.
          cat > config.yml <<EOF
          repo_url: https://paxel.github.io/fdroid/repo
          repo_name: paxel's apps
          repo_description: Releases of paxel's Android apps.
          repo_keyalias: repokey
          keystore: $RUNNER_TEMP/fdroid.p12
          keystorepass: $KEYSTORE_PASS
          keypass: $KEYSTORE_PASS
          archive_older: 1
          archive_name: paxel's apps (archive)
          archive_description: Older versions of paxel's Android apps.
          EOF
          # fdroidserver links each icon and feature graphic to a copy named
          # after its hash. Git keeps no hard links, so on the next run the
          # copies look stale and get deleted while the index still points
          # at them. Removing every app's copies first makes fdroidserver
          # create them all again.
          find repo -path 'repo/*/*' -regextype posix-extended \
            -regex '.*/(icon|featureGraphic|promoGraphic|tvBanner)_[A-Za-z0-9_=-]+\.(png|jpe?g)' -delete
          fdroid update --create-metadata
          rm config.yml
          git add -A
          git commit -m "oldbrainfix $v"
          git push

  release:
    name: GitHub Release
    needs: [build-android, build-linux, build-flatpak, screenshots, build-windows, build-macos]
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      # Not the rendered channel files, which render-channels may be
      # uploading meanwhile.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "{android,linux-*,flatpak-*,screenshots,windows,macos-*}"
          path: dist
          merge-multiple: true
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver." > notes.md
      - name: Create release (idempotent — a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Old Brain Fix $RELEASE_TAG" --notes-file notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "Old Brain Fix $RELEASE_TAG" \
              --notes-file notes.md \
              dist/*
          fi

  # Only after the Release exists: the cask, the formula and the manifest
  # point at its assets, so nothing may be pushed before they are there.
  channels:
    name: Homebrew tap + Scoop bucket
    needs: [release, render-channels]
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: channels
          path: out
      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git config --global user.name "oldbrainfix-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Casks tap/Formula
          cp out/oldbrainfix-cask.rb tap/Casks/oldbrainfix.rb
          cp out/oldbrainfix-formula.rb tap/Formula/oldbrainfix.rb
          git -C tap add Casks/oldbrainfix.rb Formula/oldbrainfix.rb
          git -C tap diff --cached --quiet || git -C tap commit -m "oldbrainfix $ver"
          git -C tap push
      - name: Push to the bucket
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/oldbrainfix.json bucket/bucket/oldbrainfix.json
          git -C bucket add bucket/oldbrainfix.json
          git -C bucket diff --cached --quiet || git -C bucket commit -m "oldbrainfix $ver"
          git -C bucket push
