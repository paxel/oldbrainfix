# SonarQube Cloud analysis (#233). What is analysed is in
# sonar-project.properties; the quality gate shows on
# https://sonarcloud.io/summary/new_code?id=paxel_oldbrainfix.
#
# On a pull request into summer (#234): the free plan analyses a pull
# request whose target is the main branch. The job waits for the quality
# gate and fails with it, and fails when tool/coverage.sh did (a failing
# test or a group below its coverage floor, #232), so "SonarQube Cloud
# analysis" is a required check of summer's ruleset: code that fails the
# gate is not merged, and the release's test gate runs no coverage again
# for a tree that passed here.
#
# On a push to summer, after each merge: the main branch's analysis, the
# baseline of new code. Report only, as the pull request was gated; the
# release checks this analysis's gate for its tagged commit.
#
# One-time setup: the project paxel_oldbrainfix on SonarQube Cloud with
# Automatic Analysis off, and the secret SQ_TOKEN for Actions, and for
# Dependabot too, whose pull requests get only Dependabot's secrets.
#
# Third-party actions are pinned to full commit SHAs (githubactions:S7637);
# the comment names the version.
name: SonarQube Cloud

on:
  push:
    branches: [summer]
  pull_request:
    branches: [summer]

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    # As in the release's desktop gate: the coverage build's test binaries
    # with full debug info would fill the runner's disk.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # The Android SDK in /usr/local/lib/android stays: the Kotlin unit
      # tests' coverage needs it.
      - name: Room on the runner's disk (preinstalled SDKs this job does not use)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # The full history, for the blame and the new-code period.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      # Clippy compiles the desktop's build scripts, so the same system
      # libraries as CI's Desktop job: ALSA for the microphone, cmake and
      # g++ for whisper.cpp; lavapipe for the GUI tests the coverage runs.
      - name: System libraries (ALSA, cmake for whisper.cpp, lavapipe for the GUI tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config cmake g++ mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - name: Clippy report for the analyzer
        working-directory: desktop
        run: |
          mkdir -p ../build
          cargo clippy --workspace --all-targets --locked --message-format=json > ../build/clippy-report.json

      # The Dart analysis needs the packages resolved (Sonar's Dart page).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Dart packages of the core and the app
        run: |
          (cd packages/oldbrainfix_core && dart pub get)
          flutter pub get

      # The LCOV files sonar-project.properties names (#232), from the
      # same script as the release's coverage floors. It never stops the
      # scan: a group below its floor still writes its file, and a failing
      # test leaves the scan without that coverage. On a pull request the
      # step after the scan fails the job for either; on summer it is
      # report only.
      - name: Coverage (LCOV for the analyzer)
        id: coverage
        continue-on-error: true
        run: |
          cargo install cargo-llvm-cov --locked --version 0.9.1
          tool/coverage.sh

      # JaCoCo XML of the Kotlin unit tests (android/), for
      # sonar.coverage.jacoco.xmlReportPaths. The Gradle project needs Java,
      # android/local.properties (written by `flutter pub get` above) and
      # the Gradle wrapper (android/gradlew is ignored by git), which
      # `flutter build apk --config-only` writes without building anything.
      # Report only, like the LCOV step.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Coverage (JaCoCo XML of the Kotlin unit tests)
        continue-on-error: true
        run: |
          flutter build apk --debug --config-only
          (cd android && ./gradlew --no-daemon :app:createDebugUnitTestCoverageReport)

      # The scanner reads the pull request from the event. On one it
      # waits for the quality gate and fails with it.
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SQ_TOKEN }}
        with:
          args: ${{ github.event_name == 'pull_request' && '-Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600' || '' }}

      # After the scan, so the analysis has every LCOV file written.
      - name: Coverage floors on the pull request
        if: github.event_name == 'pull_request' && steps.coverage.outcome == 'failure'
        run: |
          echo "::error::tool/coverage.sh failed: a test failed or a group is below its floor in tool/coverage-floors.txt (see the Coverage step)"
          exit 1
