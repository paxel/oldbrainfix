# Every check of a commit, once per tree and before the merge (#234).
#
# On a push to any branch but summer. A pull request's required checks are
# the checks of its head commit, which the push already ran, so a push with
# a pull request open runs once. summer gets no run after a merge: its
# ruleset requires a branch to be up to date before merging, so the merged
# tree is the head's tree that passed here.
#
# On a pull request only for one from a fork, whose commits are never
# pushed here. A pull request from a branch of this repository skips every
# job under another name ("… (runs on push)"), so no skipped job stands in
# for a required check the push run has to pass.
name: CI

on:
  push:
    branches-ignore: [summer]
  pull_request:

# Read-only by default; a job that writes asks for more itself.
permissions:
  contents: read

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && 'Analyze & test (runs on push)' || 'Analyze & test' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Core — analyze and test
        working-directory: packages/oldbrainfix_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          # No `!` null assertion outside tests, in the core or the app (#230).
          dart run tool/no_null_assertions.dart lib ../../lib
          dart test
      - name: App — analyze and test
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      # The app, the core and the tools, after both pub gets: the
      # package config sets the language version, and with it the style.
      - name: Dart format
        run: dart format --output=none --set-exit-if-changed .
      - name: No untranslated strings
        run: test "$(tr -d '[:space:]' < build/untranslated.json)" = "{}"
      # The generated lib/l10n/app_localizations*.dart are committed; the
      # runner regenerates them, so a stale copy would pass unseen.
      - name: The generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
          test -z "$(git status --porcelain -- lib/l10n)"
      # The user guide's frames are committed (#134): each is drawn again
      # from the seeded data and compared, with a little slack for
      # rasterising; a changed screen fails until tool/guide-frames.sh has
      # written its frames anew.
      - name: The guide's phone frames match their screens
        run: flutter test test/screenshots/screenshots_test.dart --run-skipped --concurrency=1 --plain-name 'guide frames'
      - name: The changed phone frames, for a look
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-frames-phone
          path: build/guide-frames
          if-no-files-found: ignore

  # Known vulnerabilities in any lockfile (pubspec.lock, the core's
  # pubspec.lock, desktop/Cargo.lock, android/ocr/Cargo.lock) or at the
  # commit the submodule third_party/whisper.cpp pins fail every push
  # (#231, #247). --include-git-root turns on the scanner's git extractor,
  # which reads the submodule's commit from this repository's index;
  # third_party itself is not walked, so the lockfiles of whisper.cpp's
  # examples and bindings, which the apps never build, stay out. A notice
  # that a crate is unmaintained is listed but does not fail;
  # tool/osv_gate.py decides. Ignores live in the osv-scanner.toml beside
  # each lockfile. The weekly Security run stays stricter.
  osv-scanner:
    name: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && 'Vulnerable dependencies (OSV-Scanner) (runs on push)' || 'Vulnerable dependencies (OSV-Scanner)' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # Exits 1 on any finding, unmaintained notices too; the next step
      # decides from the results, and fails when there are none.
      - name: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --format=json
            --output-file=osv-results.json
            --include-git-root
            --x-exclude=third_party
            --recursive
            ./
      - name: No known vulnerability (unmaintained notices reported only)
        run: python3 tool/osv_gate.py osv-results.json
      # The submodule at the tag third_party/README.md names, and
      # licenses/common.txt naming the same release (#247): a Dependabot
      # update that moves only the submodule fails here. A newer whisper.cpp
      # release upstream is only a warning.
      - name: whisper.cpp is at its named tag (upstream's latest release report-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tool/whisper_pin.py

  desktop:
    name: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && 'Desktop (Rust) (runs on push)' || 'Desktop (Rust)' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    # Forty test binaries with full debug info filled the runner's disk, and
    # the linker died with a bus error; line tables keep backtraces readable.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Room on the runner's disk (its preinstalled SDKs are not used here)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: System libraries (ALSA for the microphone, cmake for whisper.cpp, lavapipe for the guide's frames)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev cmake g++ mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: The fixture corpus the desktop core is tested against is current
        working-directory: packages/oldbrainfix_core
        run: |
          dart pub get
          dart run tool/gen_fixtures.dart ../../desktop/fixtures
          git diff --exit-code -- ../../desktop/fixtures
          test -z "$(git status --porcelain -- ../../desktop/fixtures)"
      - name: The third-party licence lists are current
        run: |
          cargo install cargo-about --locked --version 0.9.2 --features cli
          flutter pub get
          dart run tool/licenses.dart
          git diff --exit-code -- licenses
          test -z "$(git status --porcelain -- licenses)"
      - name: Format, lint and test
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      # The desktop half of the guide's frames (#134), drawn by the software
      # Vulkan as on any machine without a GPU.
      - name: The guide's desktop frames match their screens
        working-directory: desktop
        run: cargo test -p oldbrainfix-gui --test screenshots --locked -- --ignored guide_frames
      - name: The changed desktop frames, for a look
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-frames-desktop
          path: build/guide-frames
          if-no-files-found: ignore

  # The Flatpak (#45): the files Flathub gets are current and pass its
  # linters, and the manifest builds from source for both arches.
  flatpak-files:
    name: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && 'Flatpak files (cargo sources, metainfo, lint) (runs on push)' || 'Flatpak files (cargo sources, metainfo, lint)' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    env:
      # flatpak-builder-lint and appstreamcli, as Flathub runs them; the
      # image digest of the `latest` tag on 2026-10-23.
      LINT_IMAGE: ghcr.io/flathub-infra/flatpak-builder-lint@sha256:6057d350c1f67cfd72b87891ea779a9de2567ff70e33b480d20eebcffef08fa0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      # The generator runs in a virtualenv of this Python.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: cargo-sources.json is current with desktop/Cargo.lock
        run: |
          desktop/packaging/flatpak/cargo-sources.sh
          git diff --exit-code -- desktop/packaging/flatpak/cargo-sources.json
      - name: Metainfo, What's-new, alarm sound, OSV gate, coverage floor, whisper pin, App Store listing, iPhone icon, tested tree and Sonar gate tools — unit tests
        working-directory: tool
        run: python3 -m unittest test_whats_new test_metainfo test_alarm_sound test_osv_gate test_coverage_floor test_whisper_pin test_appstore_listing test_ios_icon test_tested_tree test_sonar_gate
      - name: Render the files as Flathub gets them
        run: |
          ver=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          desktop/packaging/flatpak/render.sh flathub "$ver" "$(git log -1 --format=%cs)" "v$ver" "$GITHUB_SHA"
          cp desktop/packaging/linux/io.github.paxel.oldbrainfix.desktop flathub/
      # The screenshots and the site exist once the release does, so the
      # metainfo is validated without the network here; the release
      # workflow lints it with the network before the Flathub update.
      - name: appstreamcli, desktop-file-validate and flatpak-builder-lint
        run: |
          docker run --rm -v "$PWD/flathub:/work" -w /work --entrypoint sh "$LINT_IMAGE" -c '
            set -e
            appstreamcli validate --no-net --explain io.github.paxel.oldbrainfix.metainfo.xml
            desktop-file-validate io.github.paxel.oldbrainfix.desktop
            flatpak-builder-lint manifest io.github.paxel.oldbrainfix.yml'

  flatpak:
    name: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && 'Flatpak from source (runs on push)' || format('Flatpak from source ({0})', matrix.arch) }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    needs: flatpak-files
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
      - name: Build the bundle from the manifest, network off during the build
        run: |
          # flatpak-builder sandboxes through bwrap, which Ubuntu's
          # AppArmor default refuses user namespaces to.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ver=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          RELEASE_DATE=$(git log -1 --format=%cs) \
            desktop/packaging/flatpak/pack.sh "$ver" "${{ matrix.arch }}" dist flatpak-repo
      - name: flatpak-builder-lint on the built repository
        if: matrix.arch == 'x86_64'
        run: |
          # Only the screenshots are excepted: they are the Release's
          # assets, so they exist from the release on.
          docker run --rm -v "$PWD/flatpak-repo:/repo" \
            -v "$PWD/desktop/packaging/flatpak/ci-lint-exceptions.json:/exceptions.json:ro" \
            ghcr.io/flathub-infra/flatpak-builder-lint@sha256:6057d350c1f67cfd72b87891ea779a9de2567ff70e33b480d20eebcffef08fa0 \
            --exceptions --user-exceptions /exceptions.json repo /repo

  apk:
    name: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && 'Debug APK (runs on push)' || 'Debug APK' }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      # RustO for Photo Texts is Rust, cross-built by the APK build.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
          components: rustfmt, clippy
      - run: cargo install cargo-ndk --locked --version 4.1.2
      # The crate's own lints (#229) with -D warnings, as for the desktop.
      - name: OCR library — format, lint and unit tests
        working-directory: android/ocr
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Every Android library is in the licences
        run: |
          (cd android && ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath) > build/runtime-classpath.txt
          dart run tool/licenses.dart --check-maven build/runtime-classpath.txt
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
