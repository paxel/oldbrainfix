name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Core — analyze and test
        working-directory: packages/oldbrainfix_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: App — analyze and test
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: No untranslated strings
        run: test "$(tr -d '[:space:]' < build/untranslated.json)" = "{}"

  desktop:
    name: Desktop (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: The fixture corpus the desktop core is tested against is current
        working-directory: packages/oldbrainfix_core
        run: |
          dart pub get
          dart run tool/gen_fixtures.dart ../../desktop/fixtures
          git diff --exit-code -- ../../desktop/fixtures
          test -z "$(git status --porcelain -- ../../desktop/fixtures)"
      - name: Format, lint and test
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # ocrs for Photo Texts is Rust, cross-built by the APK build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - name: OCR library — unit tests
        working-directory: android/ocr
        run: cargo test --locked
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
