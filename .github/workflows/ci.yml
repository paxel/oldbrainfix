name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Core — analyze and test
        working-directory: packages/oldbrainfix_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: App — analyze and test
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: No untranslated strings
        run: test "$(tr -d '[:space:]' < build/untranslated.json)" = "{}"

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
