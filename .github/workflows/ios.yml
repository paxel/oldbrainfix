# The iPhone app (#237): built for a device without signing, and the
# Runner's XCTest target run on a simulator. The release pipeline calls the
# same job before the TestFlight upload, which is release.yml's.
#
# On a push to any branch but summer, as CI (#234): the run on a pull
# request's head commit is its required check "iOS build and XCTest", so a
# bugfix/** pull request has its iPhone build before the merge too. summer
# gets no run after a merge: its ruleset requires a branch up to date
# before merging, so the merged tree is the tree built here. No pull request
# trigger: a fork's pull request cannot pass the required Sonar check
# either (no SQ_TOKEN), and macOS minutes are dear.
name: iOS

on:
  push:
    branches-ignore: [summer]
  workflow_dispatch:
  workflow_call:

# Read-only: nothing here writes.
permissions:
  contents: read

jobs:
  build-test:
    name: iOS build and XCTest
    # Xcode 26 with the iOS 26 SDK, the oldest iOS the app runs on.
    runs-on: macos-26
    steps:
      # whisper.cpp is the submodule third_party/whisper.cpp (#247).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # RustO for Photo Texts is Rust (android/ocr), built for the device
      # and the simulator (#239).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: android/ocr
      # So a red run says which Xcode, simulators and cmake it had.
      - name: Xcode, simulator runtimes and cmake
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          cmake --version
      # RustO and whisper.cpp as static libraries in ios/Native, which
      # the Runner links (#239).
      - name: Native libraries
        run: sh tool/ios-native.sh
      - run: flutter pub get
      # The Share extension (#241) and the Widgets extension (#242) ride
      # inside the app.
      - name: Build for a device, unsigned
        run: |
          flutter build ios --release --no-codesign
          test -f build/ios/iphoneos/Runner.app/PlugIns/ShareExtension.appex/Info.plist
          test -f build/ios/iphoneos/Runner.app/PlugIns/Widgets.appex/Info.plist
      # Also writes ios/Flutter/Generated.xcconfig, which xcodebuild needs.
      - name: Build for the simulator
        run: flutter build ios --simulator --debug
      - name: XCTest (RunnerTests) on an iPhone simulator
        working-directory: ios
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-(2[6-9]|[3-9][0-9])-"))
              | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator with iOS 26 or newer on this runner"
            exit 1
          fi
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=$udid"
