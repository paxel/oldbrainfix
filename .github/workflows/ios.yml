# The iPhone app (#237): built for a device without signing, and the
# Runner's XCTest target run on a simulator, on every push to summer and
# a release branch. The release pipeline calls the same job before the
# TestFlight upload, which is release.yml's.
name: iOS

on:
  push:
    branches: [summer, "release/**"]
  workflow_dispatch:
  workflow_call:

# Read-only: nothing here writes.
permissions:
  contents: read

jobs:
  build-test:
    name: iOS build and XCTest
    # Xcode 26 with the iOS 26 SDK, the oldest iOS the app runs on.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      # So a red run says which Xcode and which simulators it had.
      - name: Xcode and simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
      - run: flutter pub get
      - name: Build for a device, unsigned
        run: flutter build ios --release --no-codesign
      # Also writes ios/Flutter/Generated.xcconfig, which xcodebuild needs.
      - name: Build for the simulator
        run: flutter build ios --simulator --debug
      - name: XCTest (RunnerTests) on an iPhone simulator
        working-directory: ios
        run: |
          udid=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-(2[6-9]|[3-9][0-9])-"))
              | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone simulator with iOS 26 or newer on this runner"
            exit 1
          fi
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "id=$udid"
