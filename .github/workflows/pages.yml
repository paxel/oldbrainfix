name: Pages

# Builds the documentation site (site/ -> site-dist/) on every push to summer,
# every pull request and every release tag, as Catlog does; deploys it to
# GitHub Pages only for release tags, so the site always describes the app
# the stores have (#44). One version only, at the root: no frames, no
# /vX.Y.Z/ copies. The build fails on a page without its twin in the other
# language, a glossary term or a release without its German text, and a
# broken link.
#
# One-time steps in the repository settings:
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> Deployment branches and tags:
#      add the tag rule "v*" (the deploy job runs only on those).

on:
  push:
    branches: [summer]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test site build
        run: node --test "tool/site/*.test.js"

      - name: Build site
        run: node tool/site/build.js --base "/${{ github.event.repository.name }}/"

      - name: Check that the tag matches the pubspec.yaml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml | head -n 1)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version ($expected); the site would describe the wrong release"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site-dist

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
