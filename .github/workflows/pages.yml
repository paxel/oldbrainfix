name: Pages

# Builds the documentation site (site/ -> site-dist/) and deploys it to
# GitHub Pages only for release tags, so the site always describes the app
# the stores have (#44). One version only, at the root: no frames, no
# /vX.Y.Z/ copies. The build fails on a page without its twin in the other
# language, a glossary term or a release without its German text, and a
# broken link.
#
# The build is a check of every push to any branch (#234), so a pull
# request's head commit has it before the merge; summer builds again after
# a merge, and a tag builds again to deploy, as a build takes about a
# minute (not worth carrying its artifact over). On a pull request only
# for one from a fork, whose commits are never pushed here; one from this
# repository skips it under another name, so the skipped job stands in for
# no check of the push run.
#
# On a tag the site also carries the apt repository under /apt/
# (obf-1153): tool/apt-repo.sh builds it from the .deb files of the
# newest published Releases, signed with the key in the secrets
# APT_SIGNING_KEY and APT_SIGNING_PASSPHRASE (docs/agents/apt-repository.md);
# without them it skips with a notice and the site has no /apt/. A deploy
# replaces the whole site, so every run builds the repository anew; the
# earlier versions come back from their Releases. The tag's own .deb files
# exist only once the release workflow has made its Release, so that
# workflow runs this one again on the tag (workflow_dispatch) afterwards.
#
# One-time steps in the repository settings:
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> Deployment branches and tags:
#      add the tag rule "v*" (the deploy job runs only on those).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # The release workflow, once the tag's Release holds its .deb files.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && 'build (runs on push)' || 'build' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test site build
        run: node --test "tool/site/*.test.js"

      - name: Build site
        run: node tool/site/build.js --base "/${{ github.event.repository.name }}/"

      - name: Check that the tag matches the pubspec.yaml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' pubspec.yaml | head -n 1)"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version ($expected); the site would describe the wrong release"
            exit 1
          fi

      # The newest Releases' .deb files, at most APT_VERSIONS of them: about
      # 50 MB a version, and a Pages site may be 1 GB. With the secrets a
      # failure fails the build, as a deploy without /apt/ would take the
      # repository away from everyone who added it.
      - name: Apt repository from the Releases' .deb files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_VERSIONS: 10
        run: |
          missing=""
          [ -n "$APT_SIGNING_KEY" ] || missing="$missing APT_SIGNING_KEY"
          [ -n "$APT_SIGNING_PASSPHRASE" ] || missing="$missing APT_SIGNING_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::notice title=Apt repository skipped::Missing repository secrets:$missing. The steps are in docs/agents/apt-repository.md."
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 100 --json tagName --jq '.[].tagName' | grep '^v' | sed -n "1,${APT_VERSIONS}p")
          [ -n "$tags" ] || { echo "::error::No published Release to take .deb files from"; exit 1; }
          mkdir debs
          for tag in $tags; do
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
          done
          tool/apt-repo.sh debs site-dist/apt

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
