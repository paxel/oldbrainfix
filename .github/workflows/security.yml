# Fails when a dependency has a known advisory (OSV database, from
# pubspec.lock, packages/oldbrainfix_core/pubspec.lock, desktop/Cargo.lock and
# android/ocr/Cargo.lock). Runs weekly and on demand, because new advisories
# appear without any change in this repo.
# Notices that a crate is unmaintained fail it too. An advisory the app is not
# exposed to and no update removes is ignored in the osv-scanner.toml beside
# its lockfile, with the reason and a date when the run fails again for review.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scanner:
    name: Vulnerable dependencies (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --recursive
            ./
