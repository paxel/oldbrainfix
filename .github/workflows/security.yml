# Fails when a dependency has a known advisory (OSV database, from
# pubspec.lock, packages/oldbrainfix_core/pubspec.lock, desktop/Cargo.lock,
# android/ocr/Cargo.lock and the commit of the submodule
# third_party/whisper.cpp, as in CI). Runs weekly and on demand, because new advisories
# appear without any change in this repo. CI and the release gate run the
# same scan on every push and tag (#231), but there a notice that a crate is
# unmaintained is only listed; here it fails too, so a new one is seen
# within a week. An advisory the app is not exposed to and no update removes
# is ignored in the osv-scanner.toml beside its lockfile, with the reason and
# a date when this run fails again for review.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scanner:
    name: Vulnerable dependencies (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --include-git-root
            --x-exclude=third_party
            --recursive
            ./
