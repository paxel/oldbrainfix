# SonarQube Cloud (#233): https://sonarcloud.io/summary/new_code?id=paxel_oldbrainfix
# Analysed by .github/workflows/sonar.yml on pushes to summer; Automatic
# Analysis is off in the project's settings.
sonar.organization=paxel
sonar.projectKey=paxel_oldbrainfix
sonar.projectName=Old Brain Fix

# Dart (phone app and core), Rust (desktop) and Kotlin (Android).
# sonar.sources takes no wildcards, so each crate is listed.
sonar.sources=lib,\
  packages/oldbrainfix_core/lib,\
  desktop/crates/oldbrainfix-core/src,\
  desktop/crates/oldbrainfix-gui/src,\
  desktop/crates/oldbrainfix-l10n/src,\
  desktop/crates/oldbrainfix-whisper/src,\
  android/app/src/main
sonar.tests=test,\
  packages/oldbrainfix_core/test,\
  desktop/crates/oldbrainfix-core/tests,\
  desktop/crates/oldbrainfix-gui/tests,\
  android/app/src/test

# Generated code, build output and upstream's code. GeneratedPluginRegistrant.java
# is written by `flutter pub get`; analysing Java would need compiled classes.
# third_party/ holds the whisper.cpp submodule (#247), scanned by OSV by its
# commit; the JNI bridge in android/app/src/main/cpp is ours and stays in.
sonar.exclusions=lib/l10n/app_localizations*.dart,\
  third_party/**,\
  desktop/fixtures/**,\
  site/assets/frames/**,\
  build/**,\
  desktop/target/**,\
  **/GeneratedPluginRegistrant.java
sonar.sourceEncoding=UTF-8

# Clippy: the workflow writes this report with cargo clippy
# --message-format=json; the analyzer imports it as external issues.
sonar.rust.cargo.manifestPaths=desktop/Cargo.toml
sonar.rust.clippyReport.reportPaths=build/clippy-report.json

# Coverage (#232): tool/coverage.sh writes these LCOV files, generated code
# already left out. The core's paths start at the repository root
# (packages/oldbrainfix_core/lib/...), the app's at lib/, the Rust ones are
# absolute.
sonar.dart.lcov.reportPaths=coverage/lcov.info,packages/oldbrainfix_core/coverage/lcov.info
sonar.rust.lcov.reportPaths=desktop/coverage/lcov.info
